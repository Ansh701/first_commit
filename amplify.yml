version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm install --global pnpm@11.19.0
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter @insips/contracts build
            - pnpm --filter @insips/web build
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .pnpm-store/**/*
          - apps/web/.next/cache/**/*
