version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm install --global pnpm@11.19.0
            - cd ../..
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter @insips/contracts build
            - pnpm --filter @insips/web build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
          - ../../.pnpm-store/**/*
          - .next/cache/**/*
